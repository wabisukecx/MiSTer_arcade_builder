[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mister-arcade-auto-setup"
version = "0.1.0"
requires-python = ">=3.10"
description = "Unofficial bilingual MiSTer arcade ROM ZIP builder and FTP transfer tool"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
gui = ["PyQt6>=6.11,<7", "keyring>=25,<26"]

[project.scripts]
arcadetool = "arcadetool:main"
arcadegui = "arcadegui:main"

[tool.setuptools]
py-modules = [
  "arcadetool", "arcade_common", "arcade_bios", "arcade_mra", "arcade_pool",
  "arcade_build", "arcade_reports", "arcade_transfer", "arcade_store",
  "arcadegui", "gui_i18n", "gui_layout",
]
